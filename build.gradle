//version: 1707058017

plugins {
    id 'com.gtnewhorizons.gtnhconvention'
}

// Optional mods are needed when resolving Minecraft-facing types in integration tests.
tasks.withType(Test).configureEach {
    useJUnit()
    classpath += sourceSets.main.compileClasspath
    systemProperty 'net.bytebuddy.experimental', 'true'
    if (project.hasProperty('reliquaryTestJars')) {
        systemProperty 'reliquaryTestJars', project.property('reliquaryTestJars')
    }
}

// Opt-in Forge integration fixture; never included in a published mod.
if (project.hasProperty('generationBudgetIntegration')) {
    def fixtureJar = tasks.register('generationBudgetFixtureJar', Jar) {
        from sourceSets.test.output
        include 'com/kuba6000/mobsinfo/integration/**'
        archiveClassifier = 'generation-budget-fixture'
    }
    dependencies {
        runtimeOnlyNonPublishable(files(fixtureJar))
    }
}
